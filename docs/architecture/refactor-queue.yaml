    status: rejected
    title: WordPress AI request-log integration
    reason: Core AI Client already owns request logging; duplicating it would add dashboard scope and data handling.
  - id: OPS-001
    status: completed
    title: Repair reviewer and OpenCode CLI workflow dependency
    github_issue: 46
    github_pr: 47
    priority: high
    difficulty: medium
    evidence: Daily Audit and AI review runs fail before analysis because reviewer @main defaults to checksum-required OpenCode CLI latest; v1.18.32 has no checksum while v1.18.31 is the reviewer-documented verified pin.
    scope:
      - Pin the released reviewer v1.22.0 peeled commit SHA and make the updater/manifest traceable.
      - Pin and checksum-verify the OpenCode CLI v1.18.31 used by reviewer and research workflows.
      - Add a contract test and an idempotent stable-release updater.
      - Require PAT-backed PR events and same-repository, fail-closed campaign-PR guards.
      - Recover a current branch whose dependency PR is missing without rewriting it.
    acceptance:
      - Workflows use a released reviewer reference and record resolved reviewer tag, commit SHA, and date.
      - OpenCode CLI is pinned to a checksum-verified release.
      - Scheduled automations preserve one active campaign issue/PR invariant.
      - Main ruleset 23935160 requires the exact-head PHP 8.2 and 8.3 checks.
      - Main ruleset 23935219 requires changes to arrive through a pull request.
    status_note: Completed by merged PR #47 at afe9fdd70d0842864308f5defcea3c46caebe06f; post-merge WordPress verification passed.
  - id: OPS-002
    status: completed
    title: Close bounded workflow guard and lease gaps
    github_issue: 48
    github_pr: 49
    priority: high
    difficulty: medium
    evidence: Post-merge review found YAML CI path coverage, bounded PR enumeration, absent-branch lease, exact architecture hash binding, and fail-open branch-inspection gaps.
    scope:
      - Cover both .yml and .yaml workflow extensions in CI and contract paths.
      - Enumerate all open PRs, fail closed on inspection errors, and exempt only same-repository automation branches.
      - Use explicit empty/existing leases for both push paths and fail closed on branch inspection errors.
      - Bind manifest checksums to architecture assignments and add behavioral transition fixtures.
      - Verify the exact active ruleset IDs and required-check list rather than positive membership alone.
    acceptance:
      - No valid workflow extension or active PR can bypass the guard.
      - Current or missing dependency PR recovery is deterministic and never force-pushes over an unexpected ref.
      - Manifest hash drift and installer architecture swaps are rejected.
      - Exactly one queue item, issue, and PR remain active.
    status_note: Completed by merged PR #49 at c658df720408964d106895b9f14ea068b778207d; post-merge WordPress verification passed.
  - id: OPS-003
    status: in_progress
    title: Enforce complete reviewer manifest integrity
    github_issue: 51
    github_pr: 52
    priority: high
    difficulty: medium
    evidence: Final post-merge review found omitted provenance/schema fields and equal x64/arm64 hashes could pass current contracts.
    scope:
      - Require the complete reviewer manifest schema in the branch inspector and verifier.
      - Require exact release, CLI, ruleset, and provenance values with stable formats.
      - Require distinct x64 and arm64 hashes and bind each to the installer assignment.
      - Add behavioral fixtures for omitted fields, invalid values, equal hashes, and swaps.
    acceptance:
      - Incomplete or invalid current manifests fail closed rather than becoming stale.
      - Equal or mismatched architecture hashes are rejected.
      - No credential option values are accessed or logged.
      - Exactly one queue item, issue, and PR remain active.
