name: CI — Lint, Test, Compat

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpunit.xml.dist'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/scripts/*.php'
      - '.github/scripts/*.sh'
      - 'tests/Unit/*.sh'
      - 'scripts/build-release.sh'
      - '.distignore'
      - '.github/reviewer-dependency.json'
  pull_request:
    branches: ["main", "master"]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpunit.xml.dist'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/scripts/*.php'
      - '.github/scripts/*.sh'
      - 'tests/Unit/*.sh'
      - 'scripts/build-release.sh'
      - '.distignore'
      - '.github/reviewer-dependency.json'

permissions:
  contents: read

jobs:
  verify:
    name: PHPCS + PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Verify reviewer dependency contract
        run: php .github/scripts/verify-reviewer-dependency.php

      - name: PHP syntax check
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: WordPress Coding Standards
        run: vendor/bin/phpcs

      - name: Unit tests
        run: vendor/bin/phpunit

      - name: Repository shell contracts
        run: |
          bash tests/Unit/catalog-drift-contract.sh
          bash tests/Unit/model-radar-contract.sh

      - name: PHP compatibility (8.2+)
        run: vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion 8.2- --ignore=vendor/*,.github/* .

  # Packaging is verified on every PR that can change it. The guards that
  # decide what may ship (forbidden artifacts, path traversal, symlinks,
  # conflict markers, credential-shaped files, missing required entries)
  # otherwise only ran locally, so a regression could reach a release tag.
  #
  # Read-only with respect to the release process: this job builds the ZIP in a
  # scratch directory and inspects it, then discards it. It does not tag,
  # publish, deploy, or upload the archive. On a public repository a workflow
  # artifact is downloadable by anyone, which would turn a content-guard
  # failure into a public disclosure; the real artifact is produced by
  # release.yml, where it is reviewed before publication.
  release-package:
    name: Release package verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.2"
          extensions: mbstring
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      # Runs the guard fixtures directly so a broken guard is reported as a
      # test failure, rather than being masked by the real build below.
      - name: Release packaging contract
        run: bash tests/Unit/release-build-contract.sh

      - name: Build and verify the release package
        run: |
          set -euo pipefail
          ./scripts/build-release.sh
          zip_file="duoport-connect-for-opencode-$(grep 'Version:' duoport-connect-for-opencode.php | awk '{print $NF}' | tr -d '\r').zip"
          test -f "$zip_file"
          unzip -t "$zip_file" >/dev/null
          echo "verified: $zip_file"
