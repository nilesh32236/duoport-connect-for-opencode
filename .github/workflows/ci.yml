name: CI — Lint, Test, Compat

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpunit.xml.dist'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/scripts/*.php'
      - '.github/scripts/*.sh'
      - 'tests/Unit/*.sh'
      - '.github/reviewer-dependency.json'
  pull_request:
    branches: ["main", "master"]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpunit.xml.dist'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/scripts/*.php'
      - '.github/scripts/*.sh'
      - 'tests/Unit/*.sh'
      - '.github/reviewer-dependency.json'

permissions:
  contents: read

jobs:
  verify:
    name: PHPCS + PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Verify reviewer dependency contract
        run: php .github/scripts/verify-reviewer-dependency.php

      - name: PHP syntax check
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: WordPress Coding Standards
        run: vendor/bin/phpcs

      - name: Unit tests
        run: vendor/bin/phpunit

      - name: Reviewer branch contracts
        run: |
          bash tests/Unit/reviewer-push-contract.sh
          bash tests/Unit/reviewer-branch-inspection-contract.sh

      - name: PHP compatibility (8.2+)
        run: vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion 8.2- --ignore=vendor/*,.github/* .
