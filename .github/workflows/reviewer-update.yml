name: Update OpenCode AI Reviewer

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reviewer-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    name: Propose latest stable reviewer release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Require a PAT for traceable PR events
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT is required so the dependency PR receives pull_request checks."
            exit 1
          fi

      - name: Resolve latest stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_JSON=$(gh api repos/nilesh32236/opencode-ai-reviewer/releases/latest)
          TAG=$(jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"$RELEASE_JSON")
          PUBLISHED=$(jq -er '.published_at | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T"))' <<<"$RELEASE_JSON")
          COMMIT=$(gh api "repos/nilesh32236/opencode-ai-reviewer/commits/${TAG}" --jq .sha)
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Avoid competing campaign pull requests
        id: campaign
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! OPEN=$(.github/scripts/reviewer-pr-guard.sh "${{ github.repository }}" "${{ github.repository }}"); then
            echo "Campaign PR guard failed; refusing to update dependencies."
            exit 1
          fi
          if [ -n "$OPEN" ]; then
            echo "A campaign pull request is active; deferring reviewer update."
            printf '%s\n' "$OPEN"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Skip already-current dependency branch
        id: existing
        if: steps.campaign.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "ensure_pr=false" >> "$GITHUB_OUTPUT"
          if ! STATE=$(.github/scripts/inspect-reviewer-branch.sh "$TAG" "$COMMIT" "automation/opencode-ai-reviewer" "${{ github.repository }}" "${{ github.repository }}"); then
            echo "Existing dependency branch inspection failed; refusing to rewrite it."
            exit 1
          fi
          case "$STATE" in
            absent|stale)
              ;;
            has_pr:*)
              echo "Dependency branch already has ${STATE#has_pr:}."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              ;;
            ensure_pr)
              echo "Dependency branch is current but has no same-repository PR; ensuring one is created."
              echo "ensure_pr=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown dependency branch state: ${STATE}" >&2
              exit 1
              ;;
          esac

      - name: Prepare dependency update branch
        if: steps.campaign.outputs.proceed == 'true' && steps.existing.outputs.proceed != 'false' && steps.existing.outputs.ensure_pr != 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C automation/opencode-ai-reviewer origin/main

      - name: Update manifest and workflow references
        if: steps.campaign.outputs.proceed == 'true' && steps.existing.outputs.proceed != 'false' && steps.existing.outputs.ensure_pr != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          set -euo pipefail
          php .github/scripts/update-opencode-reviewer.php --tag "$TAG" --commit "$COMMIT" --published "$PUBLISHED"

      - name: Commit and open traceable dependency PR
        if: steps.campaign.outputs.proceed == 'true' && steps.existing.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PUBLISHED: ${{ steps.release.outputs.published }}
          ENSURE_PR: ${{ steps.existing.outputs.ensure_pr }}
        run: |
          set -euo pipefail
          REMOTE_BRANCH="automation/opencode-ai-reviewer"
          if [ "$ENSURE_PR" != "true" ]; then
            if git diff --quiet; then
              echo "Reviewer dependency is already current: $TAG @ $COMMIT"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/reviewer-dependency.json .github/workflows
            git commit -m "ci: update OpenCode AI Reviewer to $TAG"
            .github/scripts/push-reviewer-branch.sh origin "$REMOTE_BRANCH" HEAD
          else
            echo "Dependency branch is already current; ensuring its same-repository PR exists."
          fi
          BODY="## Reviewer dependency update

          - Release: \`$TAG\`
          - Commit: \`$COMMIT\`
          - Published: \`$PUBLISHED\`
          - Updated: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`

          The updater reads only the latest stable GitHub release, validates the
          semver tag and full commit SHA, updates all reviewer action references
          and the traceability manifest, and does not auto-merge."
          if ! OPEN=$(.github/scripts/reviewer-pr-guard.sh "${{ github.repository }}" "${{ github.repository }}"); then
            echo "Campaign PR recheck failed; leaving the branch without a PR."
            exit 1
          fi
          if [ -n "$OPEN" ]; then
            echo "A campaign PR appeared during update; leaving the branch without a competing PR."
            printf '%s\n' "$OPEN"
            exit 0
          fi
          if ! PR_TSV=$(gh api --paginate "repos/${{ github.repository }}/pulls?state=open&per_page=100" --jq '.[] | [.head.ref, (.head.repo.full_name // ""), .number] | @tsv'); then
            echo "Unable to inspect the dependency PR; leaving the branch without a PR."
            exit 1
          fi
          EXISTING=$(printf '%s\n' "$PR_TSV" | awk -F '\t' -v branch="$REMOTE_BRANCH" -v repository="${{ github.repository }}" '$1 == branch && $2 == repository { print $3 }')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" -R "${{ github.repository }}" --title "ci: update OpenCode AI Reviewer to $TAG" --body "$BODY"
          else
            gh pr create -R "${{ github.repository }}" --head "$REMOTE_BRANCH" --base main --title "ci: update OpenCode AI Reviewer to $TAG" --body "$BODY"
          fi
