name: Update OpenCode AI Reviewer

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Propose latest stable reviewer release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve latest stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_JSON=$(gh api repos/nilesh32236/opencode-ai-reviewer/releases/latest)
          TAG=$(jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"$RELEASE_JSON")
          PUBLISHED=$(jq -er '.published_at | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T"))' <<<"$RELEASE_JSON")
          COMMIT=$(gh api "repos/nilesh32236/opencode-ai-reviewer/commits/${TAG}" --jq .sha)
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Avoid competing campaign pull requests
        id: campaign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPEN=$(gh pr list -R "${{ github.repository }}" --state open --json headRefName --jq '.[].headRefName' | grep -v '^automation/opencode-ai-reviewer$' || true)
          if [ -n "$OPEN" ]; then
            echo "A campaign pull request is active; deferring reviewer update."
            printf '%s\n' "$OPEN"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Prepare dependency update branch
        if: steps.campaign.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C automation/opencode-ai-reviewer origin/main

      - name: Update manifest and workflow references
        if: steps.campaign.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          set -euo pipefail
          php .github/scripts/update-opencode-reviewer.php --tag "$TAG" --commit "$COMMIT" --published "$PUBLISHED"

      - name: Commit and open traceable dependency PR
        if: steps.campaign.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Reviewer dependency is already current: $TAG @ $COMMIT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reviewer-dependency.json .github/workflows
          git commit -m "ci: update OpenCode AI Reviewer to $TAG"
          REMOTE_BRANCH="automation/opencode-ai-reviewer"
          EXISTING_SHA=$(git ls-remote origin "refs/heads/${REMOTE_BRANCH}" | awk '{print $1}')
          if [ -n "$EXISTING_SHA" ]; then
            git push --force-with-lease="refs/heads/${REMOTE_BRANCH}:${EXISTING_SHA}" origin "HEAD:${REMOTE_BRANCH}"
          else
            git push origin "HEAD:${REMOTE_BRANCH}"
          fi
          BODY="## Reviewer dependency update

          - Release: \`$TAG\`
          - Commit: \`$COMMIT\`
          - Published: \`$PUBLISHED\`
          - Updated: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`

          The updater reads only the latest stable GitHub release, validates the
          semver tag and full commit SHA, updates all reviewer action references
          and the traceability manifest, and does not auto-merge."
          EXISTING=$(gh pr list -R "${{ github.repository }}" --head "$REMOTE_BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" -R "${{ github.repository }}" --title "ci: update OpenCode AI Reviewer to $TAG" --body "$BODY"
          else
            gh pr create -R "${{ github.repository }}" --head "$REMOTE_BRANCH" --base main --title "ci: update OpenCode AI Reviewer to $TAG" --body "$BODY"
          fi
